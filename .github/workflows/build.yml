name: Build Windows  
  
on:  
  push:  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
  
      - name: Install Qt  
        uses: jurplel/install-qt-action@v4  
        with:  
          version: '6.5.3'  
          host: 'windows'  
          target: 'desktop'  
          arch: 'win64_mingw'  
          modules: 'qt5compat'  
          archives: 'qtbase qtmultimedia qt5compat'  
  
      - name: Configure with qmake  
        run: qmake src\YM2608-Tone-Editor.pro -spec win32-g++ "CONFIG+=release"  
  
      - name: Build  
        run: mingw32-make -j%NUMBER_OF_PROCESSORS%  
  
      - name: Locate binary and deploy  
        shell: pwsh  
        run: |  
          $exe = Get-ChildItem -Path . -Recurse -Filter YM2608ToneEditor.exe | Select-Object -First 1  
          if (-not $exe) { Write-Error "YM2608ToneEditor.exe not found"; exit 1 }  
          Write-Output "Found binary at: $($exe.FullName)"  
          $dest = "deploy"  
          New-Item -ItemType Directory -Path $dest -Force | Out-Null  
          Copy-Item $exe.FullName -Destination $dest  
          windeployqt --release --no-translations "$dest\YM2608ToneEditor.exe"  
  
      - name: Package artifact  
        shell: pwsh  
        run: Compress-Archive -Path deploy\* -DestinationPath YM2608ToneEditor-win64.zip  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: YM2608ToneEditor-win64  
          path: YM2608ToneEditor-win64.zip
