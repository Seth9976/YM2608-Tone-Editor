name: Build Windows  
  
on:  
  push:  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-latest  
  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Ensure emu2149 sources exist  
        shell: pwsh  
        run: |  
          if (-not (Test-Path src\chips\emu2149\emu2149.c)) { Write-Output "emu2149 missing, cloning upstream"; git clone --depth 1 https://github.com/digital-sound-antiques/emu2149.git src\chips\emu2149 }  
  
      - name: Install Qt  
        uses: jurplel/install-qt-action@v4  
        with:  
          version: '6.5.3'  
          host: 'windows'  
          target: 'desktop'  
          arch: 'win64_mingw'  
          modules: 'qtmultimedia qt5compat'  
  
      - name: Configure with qmake  
        run: qmake src\YM2608-Tone-Editor.pro -spec win32-g++ "CONFIG+=release"  
  
      - name: Build  
        run: mingw32-make -j4  
  
      - name: Locate binary and deploy  
        shell: pwsh  
        run: |  
          $exe = Get-ChildItem -Path . -Recurse -Filter YM2608ToneEditor.exe | Select-Object -First 1  
          if (-not $exe) { Write-Error "YM2608ToneEditor.exe not found"; exit 1 }  
          Write-Output "Found binary at: $($exe.FullName)"  
          New-Item -ItemType Directory -Path deploy -Force | Out-Null  
          Copy-Item $exe.FullName -Destination deploy  
          $qtBin = Split-Path (Get-Command windeployqt).Source -Parent  
          $qtRoot = Split-Path $qtBin -Parent  
          Write-Output "Qt bin: $qtBin"  
          & (Get-Command windeployqt).Source --release --no-translations "deploy\YM2608ToneEditor.exe"  
          Write-Output "windeployqt exit code: $LASTEXITCODE"  
          Get-ChildItem $qtBin -Filter "Qt6*.dll" | Copy-Item -Destination deploy -Force  
          $platformPlugin = Get-ChildItem -Path $qtRoot -Recurse -Filter qwindows.dll | Select-Object -First 1  
          if (-not $platformPlugin) { Write-Error "qwindows.dll not found under $qtRoot"; exit 1 }  
          Write-Output "Found platform plugin at: $($platformPlugin.FullName)"  
          New-Item -ItemType Directory -Path deploy\platforms -Force | Out-Null  
          Copy-Item $platformPlugin.FullName -Destination deploy\platforms -Force  
          $gxxDir = Split-Path (Get-Command g++).Source -Parent  
          Write-Output "Compiler dir: $gxxDir"  
          Get-ChildItem -Path $gxxDir -Include "libstdc++-6.dll","libgcc_s_seh-1.dll","libwinpthread-1.dll" -Recurse | Select-Object -First 10 | ForEach-Object { Write-Output "Bundling runtime: $($_.FullName)"; Copy-Item $_.FullName -Destination deploy -Force }  
          Get-ChildItem -Path deploy -Recurse | Select-Object -ExpandProperty FullName  
          exit 0
  
      - name: Package artifact  
        shell: pwsh  
        run: Compress-Archive -Path deploy\* -DestinationPath YM2608ToneEditor-win64.zip  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: YM2608ToneEditor-win64  
          path: YM2608ToneEditor-win64.zip
