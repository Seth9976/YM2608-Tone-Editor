name: Build Windows  
  
on:  
  push:  
    branches: [ main, master ]  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-latest  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Install Qt  
        uses: jurplel/install-qt-action@v4  
        with:  
          version: '6.5.*'  
          arch: win64_mingw  
          modules: qt5compat  
          archives: qtbase qtmultimedia qt5compat  
  
      - name: Setup MinGW  
        uses: msys2/setup-msys2@v2  
        with:  
          msystem: MINGW64  
          update: true  
          install: mingw-w64-x86_64-toolchain  
  
      - name: Build with qmake  
        shell: pwsh  
        run: |  
          $pro = Get-ChildItem -Path . -Recurse -Filter *.pro | Select-Object -First 1; Write-Host "Found pro file: $($pro.FullName)"; Push-Location $pro.DirectoryNam



