name: Build Windows  
  
on:  
  push:  
    branches: [ main, master ]  
  pull_request:  
  workflow_dispatch:  
  
jobs:  
  build:  
    runs-on: windows-latest  
    steps:  
      - name: Checkout  
        uses: actions/checkout@v4  
        with:  
          submodules: recursive  
  
      - name: Install Qt  
        uses: jurplel/install-qt-action@v4  
        with:  
          version: '6.5.*'  
          arch: win64_mingw  
          modules: qt5compat  
          archives: qtbase qtmultimedia qt5compat  
  
      - name: Setup MinGW  
        uses: msys2/setup-msys2@v2  
        with:  
          msystem: MINGW64  
          update: true  
          install: mingw-w64-x86_64-toolchain  
  
      - name: Build with qmake  
        shell: pwsh  
        run: |  
          $pro = Get-ChildItem -Path . -Recurse -Filter *.pro | Select-Object -First 1; Write-Host "Found pro file: $($pro.FullName)"; Push-Location $pro.DirectoryName; qmake $pro.Name CONFIG+=release; mingw32-make -j $env:NUMBER_OF_PROCESSORS; Pop-Location  
  
      - name: Locate built executable  
        shell: pwsh  
        run: |  
          $exe = Get-ChildItem -Path . -Recurse -Filter YM2608ToneEditor.exe | Select-Object -First 1; Write-Host "Found exe: $($exe.FullName)"; New-Item -ItemType Directory -Path .\dist -Force | Out-Null; Copy-Item $exe.FullName .\dist\  
  
      - name: Deploy Qt dependencies  
        shell: pwsh  
        run: |  
          $exe = Get-ChildItem -Path .\dist -Filter *.exe | Select-Object -First 1; windeployqt --release --no-translations .\dist\$($exe.Name)  
  
      - name: Show dist contents  
        shell: pwsh  
        run: Get-ChildItem -Path .\dist -Recurse | Select-Object FullName, Length  
  
      - name: Upload artifact  
        uses: actions/upload-artifact@v4  
        with:  
          name: YM2608ToneEditor-win64  
          path: dist/
